default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
        exclude: request_a_govuk_domain/static|seed/
      - id: trailing-whitespace
        exclude: request_a_govuk_domain/static|seed/

  # Runs the ruff pinned in infra/uv.lock
  - repo: local
    hooks:
    - id: ruff-check
      name: ruff check
      entry: uv run ruff check --fix
      language: system
      types_or: [python, pyi]
    - id: ruff-format
      name: ruff format
      entry: uv run ruff format
      language: system
      types_or: [python, pyi]

  # Keep infra/uv.lock in sync with pyproject.toml
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
        files: ^(pyproject\.toml|uv\.lock)$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: (^\.github/workflows/)|package\.lock\.json|(^tests/fixtures/)|request_a_govuk_domain/static|seed|request_a_govuk_domain/request/static/.+.js

  # Static type checking
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
        verbose: true

  # actionlint: GitHub Actions workflow linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # shellcheck: shell script linting (workflow run blocks)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
