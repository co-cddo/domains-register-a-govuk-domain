name: Setup toolchain
description: Load pinned versions from toolchain.versions and install uv and optionally Node/CDK

inputs:
  node:
    description: Also install Node and the aws-cdk CLI
    default: "false"

runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        grep -E '^[A-Z_]+=' toolchain.versions | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: ${{ steps.versions.outputs.UV_VERSION }}
        python-version: ${{ steps.versions.outputs.PYTHON_VERSION }}
        enable-cache: true

    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.versions.outputs.NODE_VERSION }}

    - if: inputs.node == 'true'
      shell: bash
      run: npm install -g "aws-cdk@${{ steps.versions.outputs.AWS_CDK_VERSION }}" --silent
