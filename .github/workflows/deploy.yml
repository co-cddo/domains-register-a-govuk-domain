name: Deploy - Dev/Test/MISP

#######################################################
# Image deployment route to ECR
# PR to main deploys to     => dev
# push to main deploys to   => dev, test, misp
# Staging and Prod are driven by releases (release.yml)
#######################################################
#
# Guardrail: Fork PRs and Dependabot PRs are skipped
#

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy PLATFORM_DEV
    if: >-
      github.event_name == 'push' ||
      (!github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]')
    uses: ./.github/workflows/push-to-ecr.yml
    with:
      environment: PLATFORM_DEV
    secrets: inherit

  deploy-test:
    name: Deploy PLATFORM_TEST
    if: github.event_name == 'push'
    needs: deploy-dev
    uses: ./.github/workflows/push-to-ecr.yml
    with:
      environment: PLATFORM_TEST
    secrets: inherit

  deploy-misp:
    name: Deploy MISP
    if: github.event_name == 'push'
    needs: deploy-test
    uses: ./.github/workflows/push-to-ecr.yml
    with:
      environment: MISP
    secrets: inherit
