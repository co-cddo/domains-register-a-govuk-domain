name: Create ECR repositories

# One off workflow per environment. This manually deploys the CDK stack
# that creates the required ECR repositories to a chosen environment.
# The docker app image build/push is handled separately by deploy.yml.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - PLATFORM_DEV
          - PLATFORM_TEST
          - MISP
          - PLATFORM_STAGING
          - PLATFORM_PROD

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: CDK deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          node: "true"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_IAM_ROLE_CDK_DEPLOY }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Deploy stack
        env:
          STACK: domains-registration-stack
        run: |
          cdk deploy "$STACK" --require-approval never
